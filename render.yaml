# One-click deploy on Render (https://render.com). Needs a paid instance because the database lives on a persistent disk.
services:
  - type: web
    name: ideaflux-finance
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 4000
      - key: SETUP_KEY
        sync: false        # you type a secret here once; it is required to create the owner login
    disk:
      name: ideaflux-data
      mountPath: /data
      sizeGB: 1
